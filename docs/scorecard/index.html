<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Data Eval — Dataset Leaderboard</title>
  <meta name="description" content="Quality leaderboard and profiles for egocentric and manipulation datasets. Five scored dimensions, file checks, sample data and annotation inventories." />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <meta name="theme-color" content="#0C2C89" />
  <!-- OG / Twitter meta -->
  <meta property="og:title" content="Open Data Eval — Ego Dataset Leaderboard" />
  <meta property="og:description" content="Quality leaderboard and profiles for egocentric and manipulation datasets. Metadata scores, file checks, sample data and annotation inventories." />
  <meta property="og:image" content="https://varun-nair.github.io/open-data-eval/scorecard/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://varun-nair.github.io/open-data-eval/scorecard/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Open Data Eval — Ego Dataset Leaderboard" />
  <meta name="twitter:description" content="Quality leaderboard and profiles for egocentric and manipulation datasets. Metadata scores, file checks, sample data and annotation inventories." />
  <meta name="twitter:image" content="https://varun-nair.github.io/open-data-eval/scorecard/og-image.png" />

  <!-- Fonts: Fraunces (display) + IBM Plex Sans / Mono (body, code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── reset ────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { cursor: pointer; font-family: inherit; }
    select { font-family: inherit; }
    img, svg, video, iframe { max-width: 100%; }

    /* ── tokens ───────────────────────────── */
    :root {
      --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --font-body:    "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font: var(--font-body);

      /* surfaces */
      --c-bg:           #eef1f8;
      --c-surface:      #ffffff;
      --c-surface-2:    #f7f8fc;
      --c-border:       #e2e5ee;
      --c-border-strong:#c9cdd9;
      --c-track:        #edf0f6;
      --c-hover:        #eef1f6;

      /* text */
      --c-text-1:  #0d1017;
      --c-text-2:  #3f4a59;
      --c-text-3:  #8690a0;
      --c-null:    #c8cdd6;

      /* score tones */
      --c-green:    #059669;
      --c-green-bg: #e7f8f1;
      --c-amber:    #d97706;
      --c-amber-bg: #fff5df;
      --c-red:      #dc2626;
      --c-red-bg:   #fdeeee;

      /* brand + accents */
      --c-navy:   #0C2C89;
      --c-navy-2: #1f3fb8;
      --c-teal:   #0e7490;
      --c-blue:   #2563eb;
      --c-purple: #7c3aed;
      --c-orange: #ea580c;

      /* medals */
      --c-gold:   #F5B301;
      --c-silver: #9aa5b5;
      --c-bronze: #c47a3a;

      /* partners */
      --c-hf: #FFD21E;

      /* dimension accents */
      --c-accent-tech:   #3b82f6;
      --c-accent-access: #8b5cf6;
      --c-accent-rel:    #f59e0b;
      --c-accent-scale:  #10b981;
      --c-accent-fit:    #06b6d4;
      --c-accent-hw:     #6b7280;

      /* effects */
      --grad-hero: linear-gradient(118deg, #061a52 0%, #0C2C89 36%, #1f3fb8 64%, #0e7490 100%);
      --radius-card: 16px;
      --shadow-card:  0 1px 2px rgba(15,17,23,0.05), 0 6px 20px rgba(12,44,137,0.06);
      --shadow-lift:  0 2px 4px rgba(15,17,23,0.06), 0 14px 36px rgba(12,44,137,0.12);
      --shadow-hover: 0 4px 8px rgba(15,17,23,0.08), 0 22px 48px rgba(12,44,137,0.16);
      --shadow-stamp: inset 0 1px 0 rgba(255,255,255,0.5), 0 1px 3px rgba(15,17,23,0.15);
    }

    /* ── base ─────────────────────────────── */
    html, body { min-height: 100%; background: var(--c-bg); color: var(--c-text-1); }
    body {
      font-family: var(--font-body); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      background-image:
        radial-gradient(1100px 500px at 50% -120px, rgba(12,44,137,0.10), transparent 70%),
        radial-gradient(700px 400px at 100% 30%, rgba(14,116,144,0.06), transparent 70%);
      background-repeat: no-repeat;
    }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    #root > main { flex: 1; }

    /* ── scrollbar ────────────────────────── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-border-strong); border-radius: 4px; }

    /* ── table base ───────────────────────── */
    table { border-collapse: collapse; }
    th, td { border: none; }

    /* ── pre-hydration placeholder ────────── */
    .boot { padding: 48px 20px; text-align: center; color: var(--c-text-3); font-size: 13px; }
  </style>
  <link rel="stylesheet" href="./scorecard.css?v=20261023-leaderboard" />
</head>
<body>
  <div id="root"><div class="boot">Loading the leaderboard…</div></div>
  <noscript><div class="boot">Open Data Eval needs JavaScript to render the leaderboard.</div></noscript>

  <!-- React + ReactDOM (production UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone (transpiles JSX in-browser — pinned to keep classic-script output) -->
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

  <!-- Dataset scores (generated by eval/metadata_eval.py) -->
  <script src="./scorecard_data.js?v=20261023-leaderboard"></script>
  <!-- Curated extras: links, samples, annotation inventory (generated by eval/build_extras.py) -->
  <script src="./dataset_extras.js?v=20261023-leaderboard"></script>
  <!-- Plain-English guide to every score (hand-written) -->
  <script src="./metrics_guide.js?v=20261023-leaderboard"></script>

  <!-- Scorecard app -->
  <script type="text/babel" src="./scorecard.jsx?v=20261023-leaderboard" data-presets="react"></script>
</body>
</html>
