<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Data Eval — Dataset Leaderboard</title>
  <meta name="description" content="Quality leaderboard and profiles for egocentric and manipulation datasets. Five scored dimensions, file checks, sample data and annotation inventories." />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115" />
  <!-- OG / Twitter meta -->
  <meta property="og:title" content="Open Data Eval — Ego Dataset Leaderboard" />
  <meta property="og:description" content="Quality leaderboard and profiles for egocentric and manipulation datasets. Metadata scores, file checks, sample data and annotation inventories." />
  <meta property="og:image" content="https://varun-nair.github.io/open-data-eval/scorecard/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://varun-nair.github.io/open-data-eval/scorecard/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Open Data Eval — Ego Dataset Leaderboard" />
  <meta name="twitter:description" content="Quality leaderboard and profiles for egocentric and manipulation datasets. Metadata scores, file checks, sample data and annotation inventories." />
  <meta name="twitter:image" content="https://varun-nair.github.io/open-data-eval/scorecard/og-image.png" />

  <!-- Theme: light by default. A stored choice (localStorage "ode-theme", set by the toggle in the nav)
       or `?theme=light|dark` in the URL pins one. Set before paint so there is no flash. -->
  <script>
    (function () {
      var t = null;
      try { t = new URLSearchParams(window.location.search).get("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") { try { t = localStorage.getItem("ode-theme"); } catch (e) {} }
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>

  <!-- Fonts: Instrument Serif (display) + Inter (UI, tabular numerals). Code uses the system monospace stack. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />

  <style>
    /* ── reset ────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { cursor: pointer; font-family: inherit; }
    select { font-family: inherit; }
    img, svg, video, iframe { max-width: 100%; }

    /* ── tokens ───────────────────────────── */
    :root {
      --font-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --font-body:    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono:    ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --font: var(--font-body);

      /* type scale */
      --fs-2xs: 10px;  --fs-xs: 11px;   --fs-sm: 12.5px; --fs-base: 14px; --fs-md: 15.5px;
      --fs-lg: 18px;   --fs-xl: 22px;   --fs-2xl: 28px;  --fs-3xl: 36px;
      --fs-title:   clamp(34px, 4.4vw, 54px);   /* dataset titles */
      --fs-display: clamp(44px, 9vw, 104px);    /* hero wordmark */
      --track-caps: .14em;
      --radius-card: 18px;

      /* ── light theme (default; also the fallback for browsers without light-dark()) ── */
      color-scheme: light;
      --c-bg:            #ffffff;
      --c-surface:       #ffffff;
      --c-surface-2:     #f6f7f9;
      --c-glass:         #ffffff;
      --c-border:        #e5e7eb;
      --c-border-strong: #cfd3da;
      --c-hair:          rgba(17,19,24,.09);
      --c-track:         #f1f2f5;
      --c-hover:         #f4f5f8;

      --c-text-1: #111318;
      --c-text-2: #4b5160;
      --c-text-3: #6b7280;
      --c-null:   #cfd3da;

      --c-ink:    #111318;   /* primary emphasis: ink in light, off-white in dark */
      --c-ink-fg: #ffffff;
      --c-ink-2:  #2a2f3b;
      --c-navy:   var(--c-ink);
      --c-navy-2: var(--c-ink-2);

      --c-green:    #1b7a4e;  --c-green-bg: #e2f2e8;
      --c-amber:    #b35a06;  --c-amber-bg: #fbecd6;
      --c-red:      #b4231f;  --c-red-bg:   #fbe3e1;

      --c-teal:   #0e7490;  --c-blue: #2457d6;  --c-purple: #6d3fd1;  --c-orange: #d9541a;
      --c-gold:   #d9a429;  --c-silver: #a4abb7;  --c-bronze: #bb7a3d;  --c-gold-ink: #2b2000;
      --c-hf:     #FFD21E;

      --c-accent-tech:   #2f6fe8;
      --c-accent-access: #7c4fe0;
      --c-accent-rel:    #d98a0d;
      --c-accent-scale:  #15a26f;
      --c-accent-fit:    #0e9dba;
      --c-accent-hw:     #6b7280;

      --c-code-bg: #15171c;  --c-code-fg: #ebe7de;
      --c-tip-bg:  #15171c;  --c-tip-fg: rgba(246,243,236,.94);  --c-tip-k: #e6c35a;
      --c-media-bg: #0f1116;

      --shadow-card:  0 1px 1px rgba(16,18,24,.04), 0 10px 28px -14px rgba(16,18,24,.14);
      --shadow-lift:  0 1px 2px rgba(16,18,24,.06), 0 24px 50px -22px rgba(16,18,24,.20);
      --shadow-hover: 0 2px 4px rgba(16,18,24,.06), 0 30px 64px -26px rgba(16,18,24,.26);
      --shadow-stamp: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 3px rgba(16,18,24,.12);
    }

    /* Both themes in one place: light-dark() resolves against color-scheme, which data-theme on <html>
       pins (light unless the user picked dark). Browsers without light-dark() keep the light tokens above. */
    @supports (color: light-dark(#000, #fff)) {
      :root {
        color-scheme: light dark;
        --c-bg:            light-dark(#ffffff, #0f1115);
        --c-surface:       light-dark(#ffffff, #161a21);
        --c-surface-2:     light-dark(#f6f7f9, #1b2029);
        --c-glass:         light-dark(#ffffff, #161a21);
        --c-border:        light-dark(#e5e7eb, #262b35);
        --c-border-strong: light-dark(#cfd3da, #3a4150);
        --c-hair:          light-dark(rgba(17,19,24,.09), rgba(232,234,238,.10));
        --c-track:         light-dark(#f1f2f5, #1d222b);
        --c-hover:         light-dark(#f4f5f8, #1c212a);

        --c-text-1: light-dark(#111318, #e8eaee);
        --c-text-2: light-dark(#4b5160, #aab0bc);
        --c-text-3: light-dark(#6b7280, #858c99);
        --c-null:   light-dark(#cfd3da, #3a4150);

        --c-ink:    light-dark(#111318, #e8eaee);
        --c-ink-fg: light-dark(#ffffff, #0f1115);
        --c-ink-2:  light-dark(#2a2f3b, #d0d4dc);

        --c-green:    light-dark(#1b7a4e, #39d98a);  --c-green-bg: light-dark(#e2f2e8, rgba(57,217,138,.13));
        --c-amber:    light-dark(#b35a06, #f3b84b);  --c-amber-bg: light-dark(#fbecd6, rgba(243,184,75,.14));
        --c-red:      light-dark(#b4231f, #ff7369);  --c-red-bg:   light-dark(#fbe3e1, rgba(255,115,105,.14));

        --c-teal:   light-dark(#0e7490, #39b6d4);  --c-blue:   light-dark(#2457d6, #6c96ff);
        --c-purple: light-dark(#6d3fd1, #a98bff);  --c-orange: light-dark(#d9541a, #ff8a4c);
        --c-gold:   light-dark(#d9a429, #f0c050);  --c-silver: light-dark(#a4abb7, #b6bdc8);
        --c-bronze: light-dark(#bb7a3d, #cf8a4a);

        --c-accent-tech:   light-dark(#2f6fe8, #5b8dff);
        --c-accent-access: light-dark(#7c4fe0, #a58bff);
        --c-accent-rel:    light-dark(#d98a0d, #f3b24b);
        --c-accent-scale:  light-dark(#15a26f, #34d399);
        --c-accent-fit:    light-dark(#0e9dba, #38c6e8);
        --c-accent-hw:     light-dark(#6b7280, #8b93a1);

        --c-code-bg:  light-dark(#15171c, #0b0d12);  --c-code-fg: light-dark(#ebe7de, #e6e2d8);
        --c-tip-bg:   light-dark(#15171c, #1d222c);  --c-tip-fg:  light-dark(rgba(246,243,236,.94), rgba(236,232,223,.94));
        --c-tip-k:    light-dark(#e6c35a, #f0c050);
        --c-media-bg: light-dark(#0f1116, #0b0d12);

        --shadow-card:  0 1px 1px light-dark(rgba(16,18,24,.04), rgba(0,0,0,.30)), 0 10px 28px -14px light-dark(rgba(16,18,24,.14), rgba(0,0,0,.55));
        --shadow-lift:  0 1px 2px light-dark(rgba(16,18,24,.06), rgba(0,0,0,.35)), 0 24px 50px -22px light-dark(rgba(16,18,24,.20), rgba(0,0,0,.70));
        --shadow-hover: 0 2px 4px light-dark(rgba(16,18,24,.06), rgba(0,0,0,.35)), 0 30px 64px -26px light-dark(rgba(16,18,24,.26), rgba(0,0,0,.75));
        --shadow-stamp: inset 0 1px 0 light-dark(rgba(255,255,255,.6), rgba(255,255,255,.06)), 0 1px 3px light-dark(rgba(16,18,24,.12), rgba(0,0,0,.4));

      }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"]  { color-scheme: dark; }
    }
    /* ── base ─────────────────────────────── */
    html { min-height: 100%; background: var(--c-bg); color: var(--c-text-1); }
    body {
      position: relative; min-height: 100vh;
      font-family: var(--font-body); font-size: var(--fs-base); line-height: 1.55;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility; font-optical-sizing: auto;
    }
    #root { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    #root > main { flex: 1; }

    /* ── scrollbar ────────────────────────── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-border-strong); border-radius: 4px; }

    /* ── table base ───────────────────────── */
    table { border-collapse: collapse; }
    th, td { border: none; }

    /* ── pre-hydration placeholder ────────── */
    .boot { padding: 48px 20px; text-align: center; color: var(--c-text-3); font-size: 13px; }
  </style>
  <link rel="stylesheet" href="./scorecard.css?v=20261023-clean" />
</head>
<body>
  <div id="root"><div class="boot">Loading the leaderboard…</div></div>
  <noscript><div class="boot">Open Data Eval needs JavaScript to render the leaderboard.</div></noscript>

  <!-- React + ReactDOM (production UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone (transpiles JSX in-browser — pinned to keep classic-script output) -->
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

  <!-- Dataset scores (generated by eval/metadata_eval.py) -->
  <script src="./scorecard_data.js?v=20261023-clean"></script>
  <!-- Curated extras: links, samples, annotation inventory (generated by eval/build_extras.py) -->
  <script src="./dataset_extras.js?v=20261023-clean"></script>
  <!-- Plain-English guide to every score (hand-written) -->
  <script src="./metrics_guide.js?v=20261023-clean"></script>

  <!-- Scorecard app -->
  <script type="text/babel" src="./scorecard.jsx?v=20261023-clean" data-presets="react"></script>
</body>
</html>
