<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Data Eval — Dataset Leaderboard</title>
  <meta name="description" content="Quality leaderboard and profiles for egocentric and manipulation datasets. Five scored dimensions, file checks, sample data and annotation inventories." />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1ea" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c11" />
  <!-- OG / Twitter meta -->
  <meta property="og:title" content="Open Data Eval — Ego Dataset Leaderboard" />
  <meta property="og:description" content="Quality leaderboard and profiles for egocentric and manipulation datasets. Metadata scores, file checks, sample data and annotation inventories." />
  <meta property="og:image" content="https://varun-nair.github.io/open-data-eval/scorecard/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://varun-nair.github.io/open-data-eval/scorecard/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Open Data Eval — Ego Dataset Leaderboard" />
  <meta name="twitter:description" content="Quality leaderboard and profiles for egocentric and manipulation datasets. Metadata scores, file checks, sample data and annotation inventories." />
  <meta name="twitter:image" content="https://varun-nair.github.io/open-data-eval/scorecard/og-image.png" />

  <!-- Theme follows the OS (prefers-color-scheme). `?theme=light` / `?theme=dark` forces one — handy for previews and screenshots. -->
  <script>
    (function () {
      try {
        var t = new URLSearchParams(window.location.search).get("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <!-- Fonts: Instrument Serif (display) + Inter (UI, tabular numerals). Code uses the system monospace stack. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />

  <style>
    /* ── reset ────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { cursor: pointer; font-family: inherit; }
    select { font-family: inherit; }
    img, svg, video, iframe { max-width: 100%; }

    /* ── tokens ───────────────────────────── */
    :root {
      --font-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --font-body:    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono:    ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --font: var(--font-body);

      /* type scale */
      --fs-2xs: 10px;  --fs-xs: 11px;   --fs-sm: 12.5px; --fs-base: 14px; --fs-md: 15.5px;
      --fs-lg: 18px;   --fs-xl: 22px;   --fs-2xl: 28px;  --fs-3xl: 36px;
      --fs-title:   clamp(34px, 4.4vw, 54px);   /* dataset titles */
      --fs-display: clamp(44px, 9vw, 104px);    /* hero wordmark */
      --track-caps: .14em;
      --radius-card: 18px;

      /* ── light theme (fallback for browsers without light-dark()) ── */
      color-scheme: light;
      --c-bg:            #f4f1ea;
      --c-surface:       #fffdf9;
      --c-surface-2:     #f7f4ed;
      --c-glass:         rgba(255,253,249,.78);
      --c-border:        #e5dfd3;
      --c-border-strong: #cdc5b6;
      --c-hair:          rgba(21,23,28,.10);
      --c-track:         #ede8dd;
      --c-hover:         #f5f1e8;

      --c-text-1: #15171c;
      --c-text-2: #474a53;
      --c-text-3: #686c75;
      --c-null:   #c9c3b7;

      --c-ink:    #15171c;   /* primary emphasis: ink in light, cream in dark */
      --c-ink-fg: #f6f3ec;
      --c-ink-2:  #2b2f3a;
      --c-navy:   var(--c-ink);
      --c-navy-2: var(--c-ink-2);

      --c-green:    #1b7a4e;  --c-green-bg: #e2f2e8;
      --c-amber:    #b35a06;  --c-amber-bg: #fbecd6;
      --c-red:      #b4231f;  --c-red-bg:   #fbe3e1;

      --c-teal:   #0e7490;  --c-blue: #2457d6;  --c-purple: #6d3fd1;  --c-orange: #d9541a;
      --c-gold:   #d9a429;  --c-silver: #a4abb7;  --c-bronze: #bb7a3d;  --c-gold-ink: #2b2000;
      --c-hf:     #FFD21E;

      --c-accent-tech:   #2f6fe8;
      --c-accent-access: #7c4fe0;
      --c-accent-rel:    #d98a0d;
      --c-accent-scale:  #15a26f;
      --c-accent-fit:    #0e9dba;
      --c-accent-hw:     #6b7280;

      --c-code-bg: #15171c;  --c-code-fg: #ebe7de;
      --c-tip-bg:  #15171c;  --c-tip-fg: rgba(246,243,236,.94);  --c-tip-k: #e6c35a;
      --c-media-bg: #0f1116;

      --shadow-card:  0 1px 1px rgba(20,18,12,.04), 0 12px 32px -14px rgba(20,18,12,.16);
      --shadow-lift:  0 1px 2px rgba(20,18,12,.06), 0 26px 54px -22px rgba(20,18,12,.24);
      --shadow-hover: 0 2px 4px rgba(20,18,12,.06), 0 34px 70px -26px rgba(20,18,12,.30);
      --shadow-stamp: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 3px rgba(20,18,12,.14);

      /* backdrop: aurora blobs + radar motif + film grain */
      --aur-1: rgba(126,166,255,.50);
      --aur-2: rgba(255,186,120,.48);
      --aur-3: rgba(132,214,196,.46);
      --aur-4: rgba(206,170,255,.40);
      --motif: rgba(21,23,28,.085);
      --grain-o: .065;
      --grain-blend: multiply;
    }

    /* Both themes in one place: light-dark() resolves against color-scheme, which follows the OS
       unless data-theme pins it. Browsers without light-dark() keep the light tokens above. */
    @supports (color: light-dark(#000, #fff)) {
      :root {
        color-scheme: light dark;
        --c-bg:            light-dark(#f4f1ea, #0a0c11);
        --c-surface:       light-dark(#fffdf9, #12151c);
        --c-surface-2:     light-dark(#f7f4ed, #171b24);
        --c-glass:         light-dark(rgba(255,253,249,.78), rgba(18,21,28,.74));
        --c-border:        light-dark(#e5dfd3, #242933);
        --c-border-strong: light-dark(#cdc5b6, #37404f);
        --c-hair:          light-dark(rgba(21,23,28,.10), rgba(236,232,223,.10));
        --c-track:         light-dark(#ede8dd, #1b2029);
        --c-hover:         light-dark(#f5f1e8, #191e27);

        --c-text-1: light-dark(#15171c, #ece8df);
        --c-text-2: light-dark(#474a53, #b4b0a7);
        --c-text-3: light-dark(#686c75, #8b867e);
        --c-null:   light-dark(#c9c3b7, #3b4049);

        --c-ink:    light-dark(#15171c, #ece8df);
        --c-ink-fg: light-dark(#f6f3ec, #0f1116);
        --c-ink-2:  light-dark(#2b2f3a, #d6d1c6);

        --c-green:    light-dark(#1b7a4e, #39d98a);  --c-green-bg: light-dark(#e2f2e8, rgba(57,217,138,.13));
        --c-amber:    light-dark(#b35a06, #f3b84b);  --c-amber-bg: light-dark(#fbecd6, rgba(243,184,75,.14));
        --c-red:      light-dark(#b4231f, #ff7369);  --c-red-bg:   light-dark(#fbe3e1, rgba(255,115,105,.14));

        --c-teal:   light-dark(#0e7490, #39b6d4);  --c-blue:   light-dark(#2457d6, #6c96ff);
        --c-purple: light-dark(#6d3fd1, #a98bff);  --c-orange: light-dark(#d9541a, #ff8a4c);
        --c-gold:   light-dark(#d9a429, #f0c050);  --c-silver: light-dark(#a4abb7, #b6bdc8);
        --c-bronze: light-dark(#bb7a3d, #cf8a4a);

        --c-accent-tech:   light-dark(#2f6fe8, #5b8dff);
        --c-accent-access: light-dark(#7c4fe0, #a58bff);
        --c-accent-rel:    light-dark(#d98a0d, #f3b24b);
        --c-accent-scale:  light-dark(#15a26f, #34d399);
        --c-accent-fit:    light-dark(#0e9dba, #38c6e8);
        --c-accent-hw:     light-dark(#6b7280, #8b93a1);

        --c-code-bg:  light-dark(#15171c, #0b0d12);  --c-code-fg: light-dark(#ebe7de, #e6e2d8);
        --c-tip-bg:   light-dark(#15171c, #1d222c);  --c-tip-fg:  light-dark(rgba(246,243,236,.94), rgba(236,232,223,.94));
        --c-tip-k:    light-dark(#e6c35a, #f0c050);
        --c-media-bg: light-dark(#0f1116, #0a0c11);

        --shadow-card:  0 1px 1px light-dark(rgba(20,18,12,.04), rgba(0,0,0,.30)), 0 12px 32px -14px light-dark(rgba(20,18,12,.16), rgba(0,0,0,.55));
        --shadow-lift:  0 1px 2px light-dark(rgba(20,18,12,.06), rgba(0,0,0,.35)), 0 26px 54px -22px light-dark(rgba(20,18,12,.24), rgba(0,0,0,.70));
        --shadow-hover: 0 2px 4px light-dark(rgba(20,18,12,.06), rgba(0,0,0,.35)), 0 34px 70px -26px light-dark(rgba(20,18,12,.30), rgba(0,0,0,.75));
        --shadow-stamp: inset 0 1px 0 light-dark(rgba(255,255,255,.6), rgba(255,255,255,.06)), 0 1px 3px light-dark(rgba(20,18,12,.14), rgba(0,0,0,.4));

        --aur-1: light-dark(rgba(126,166,255,.50), rgba(72,86,230,.50));
        --aur-2: light-dark(rgba(255,186,120,.48), rgba(16,160,150,.42));
        --aur-3: light-dark(rgba(132,214,196,.46), rgba(228,146,54,.34));
        --aur-4: light-dark(rgba(206,170,255,.40), rgba(128,74,222,.42));
        --motif: light-dark(rgba(21,23,28,.085), rgba(236,232,223,.085));
      }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"]  { color-scheme: dark; }
    }
    /* non-colour tokens that differ per theme */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --grain-o: .10; --grain-blend: overlay; }
    }
    :root[data-theme="dark"] { --grain-o: .10; --grain-blend: overlay; }

    /* ── base ─────────────────────────────── */
    html { min-height: 100%; background: var(--c-bg); color: var(--c-text-1); }
    body {
      position: relative; min-height: 100vh;
      font-family: var(--font-body); font-size: var(--fs-base); line-height: 1.55;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility; font-optical-sizing: auto;
    }
    #root { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    #root > main { flex: 1; }

    /* ── backdrop ─────────────────────────── */
    /* Sky: drifting aurora + etched radar motif, absolute at the top of the document and masked
       out below the podium so the table and dataset pages sit on calm ground. */
    .sky { position: absolute; inset: 0 0 auto 0; height: min(150vh, 1500px); min-height: 960px; z-index: 0;
      overflow: hidden; pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 48%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 48%, transparent 100%); }
    .aurora { position: absolute; inset: 0; }
    .aurora i { position: absolute; display: block; border-radius: 50%; filter: blur(72px); will-change: transform;
      animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; }
    .aurora .a1 { width: max(62vw, 560px); height: max(62vw, 560px); left: -12vw; top: -26vw;
      background: radial-gradient(closest-side, var(--aur-1), transparent 72%); animation-name: drift1; animation-duration: 38s; }
    .aurora .a2 { width: max(54vw, 520px); height: max(54vw, 520px); right: -14vw; top: -22vw;
      background: radial-gradient(closest-side, var(--aur-2), transparent 72%); animation-name: drift2; animation-duration: 46s; }
    .aurora .a3 { width: max(50vw, 460px); height: max(50vw, 460px); left: 26vw; top: -22vw;
      background: radial-gradient(closest-side, var(--aur-3), transparent 72%); animation-name: drift3; animation-duration: 52s; }
    .aurora .a4 { width: max(42vw, 400px); height: max(42vw, 400px); right: 10vw; top: 2vw;
      background: radial-gradient(closest-side, var(--aur-4), transparent 72%); animation-name: drift4; animation-duration: 42s; }
    @keyframes drift1 { to { transform: translate3d(10vw, 7vw, 0) scale(1.14); } }
    @keyframes drift2 { to { transform: translate3d(-9vw, 9vw, 0) scale(.92); } }
    @keyframes drift3 { to { transform: translate3d(-12vw, 5vw, 0) scale(1.18); } }
    @keyframes drift4 { to { transform: translate3d(7vw, -5vw, 0) scale(1.08); } }
    .motif { position: absolute; width: clamp(720px, 66vw, 1080px); height: auto; right: -12vw; top: -14vw;
      color: var(--motif); transform-origin: 50% 50%; animation: motif-spin 300s linear infinite; }
    .motif polygon, .motif line { fill: none; stroke: currentColor; stroke-width: 1.3; vector-effect: non-scaling-stroke; }
    .motif .prof { fill: currentColor; fill-opacity: .5; stroke-width: 1.8; }
    @keyframes motif-spin { to { transform: rotate(360deg); } }
    /* Film grain over everything, fixed to the viewport. */
    .grain { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--grain-o); mix-blend-mode: var(--grain-blend);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 1 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
      background-size: 220px 220px; }
    @media (max-width: 720px) {
      .aurora i { filter: blur(54px); }
      .sky { min-height: 820px; }
      .motif { width: 640px; right: -220px; top: -140px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .aurora i, .motif { animation: none !important; }
    }

    /* ── scrollbar ────────────────────────── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-border-strong); border-radius: 4px; }

    /* ── table base ───────────────────────── */
    table { border-collapse: collapse; }
    th, td { border: none; }

    /* ── pre-hydration placeholder ────────── */
    .boot { padding: 48px 20px; text-align: center; color: var(--c-text-3); font-size: 13px; }
  </style>
  <link rel="stylesheet" href="./scorecard.css?v=20261023-premium" />
</head>
<body>
  <!-- Decorative backdrop: procedurally generated (CSS gradients + inline SVG), no media assets. -->
  <div class="sky" aria-hidden="true">
    <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i></div>
    <svg class="motif" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" focusable="false">
      <polygon points="600.0,450.0 742.7,553.6 688.2,721.4 511.8,721.4 457.3,553.6"/>
      <polygon points="600.0,330.0 856.8,516.6 758.7,818.4 441.3,818.4 343.2,516.6"/>
      <polygon points="600.0,210.0 970.9,479.5 829.2,915.5 370.8,915.5 229.1,479.5"/>
      <polygon points="600.0,90.0 1085.0,442.4 899.8,1012.6 300.2,1012.6 115.0,442.4"/>
      <line x1="600" y1="600" x2="600.0" y2="90.0"/>
      <line x1="600" y1="600" x2="1085.0" y2="442.4"/>
      <line x1="600" y1="600" x2="899.8" y2="1012.6"/>
      <line x1="600" y1="600" x2="300.2" y2="1012.6"/>
      <line x1="600" y1="600" x2="115.0" y2="442.4"/>
      <polygon class="prof" points="600.0,120.0 913.8,498.0 846.9,939.8 441.3,818.4 172.0,460.9"/>
    </svg>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <div id="root"><div class="boot">Loading the leaderboard…</div></div>
  <noscript><div class="boot">Open Data Eval needs JavaScript to render the leaderboard.</div></noscript>

  <!-- React + ReactDOM (production UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone (transpiles JSX in-browser — pinned to keep classic-script output) -->
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

  <!-- Dataset scores (generated by eval/metadata_eval.py) -->
  <script src="./scorecard_data.js?v=20261023-premium"></script>
  <!-- Curated extras: links, samples, annotation inventory (generated by eval/build_extras.py) -->
  <script src="./dataset_extras.js?v=20261023-premium"></script>
  <!-- Plain-English guide to every score (hand-written) -->
  <script src="./metrics_guide.js?v=20261023-premium"></script>

  <!-- Scorecard app -->
  <script type="text/babel" src="./scorecard.jsx?v=20261023-premium" data-presets="react"></script>
</body>
</html>
